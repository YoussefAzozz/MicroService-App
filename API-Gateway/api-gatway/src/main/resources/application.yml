server:
  port: 4004

spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      
      routes:
        - id: patient-direct-add-route
          uri: http://patient-service:4000
          predicates:
            - Path=/patients
            - Method=POST
          filters:
            - StripPrefix=0

        - id: patient-service-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
            - name: ValidateTokenFilter


        - id: auth-login-route
          uri: http://auth-service:4005
          predicates:
            - Path=/api/login/**
          filters:
            - StripPrefix=1

        - id: google-oauth-callback-route
          uri: http://auth-service:4005
          predicates:
            - Path=/api/login/oauth2/**
          filters:
            - StripPrefix=2
